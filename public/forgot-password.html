<!DOCTYPE html>
<html>
<head>
<link rel="icon" type="image/png" href="assets/images/skyfall-high-resolution-logo-color-on-transparent-background.png">

    <title>MindRush — Forgot Password</title>
    <style> 
        .login-box {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 400px;
            padding: 40px;
            transform: translate(-50%, -50%);
            background: rgba(24, 20, 20, 0.987);
            box-sizing: border-box;
            box-shadow: 0 15px 25px rgba(0,0,0,.6);
            border-radius: 10px;
        }

        .login-box .user-box {
            position: relative;
        }

        .login-box .user-box input {
            width: 100%;
            padding: 10px 0;
            font-size: 16px;
            color: #fff;
            margin-bottom: 30px;
            border: none;
            border-bottom: 1px solid #fff;
            outline: none;
            background: transparent;
        }

        .login-box .user-box label {
            position: absolute;
            top: 0;
            left: 0;
            padding: 10px 0;
            font-size: 16px;
            color: #fff;
            pointer-events: none;
            transition: .5s;
        }

        .login-box .user-box input:focus ~ label,
        .login-box .user-box input:valid ~ label {
            top: -20px;
            left: 0;
            color: #bdb8b8;
            font-size: 12px;
        }
        h1{
            color: #ffffff;
            font-family: 'Press Start 2P', cursive;
            font-size:50px;
            margin-top: 150px;
        }

        .set-pass {
            position: relative;
            display: inline-block;
            padding: 10px 20px;
            color: #ffffff;
            font-size: 16px;
            text-decoration: none;
            text-transform: uppercase;
            overflow: hidden;
            transition: .5s;
            margin-top: 40px;
            letter-spacing: 4px;
            background: none;
            border: none;
        }

        .set-pass:hover {
            background: wheat;
            color: black;
            border-radius: 5px;
            box-shadow: 0 0 10px white,
                        0 0 25px bisque,
                        0 0 25px powderblue,
                        0 0 75px skyblue;
        }

        .set-pass span {
            position: absolute;
            display: block;
        }

        @keyframes btn-anim1 {
            0% {
                left: -100%;
            }

            50%,100% {
                left: 100%;
            }
        }

        .set-pass span:nth-child(1) {
            bottom: 2px;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, whitesmoke);
            animation: btn-anim1 2s linear infinite;
        }
        .welcome{
            color: white;
            position: absolute;
            top: -3%;
            left: 10%;
            font-size: 25px;
        }
        .text-login{
            color: white;
            font-size: 16px;
        }
        .data{
            color: red;
        }
        .msg{
            color: white;
        }
    </style>
    <link rel="stylesheet" href="css/main.css">
</head>
<body background="assets/images/CoarseBothInvisiblerail.webp">
<center>
        <h1 style="color: #ffffff; font-family: 'Press Start 2P', monospace; font-size: 50px; text-shadow: 0 0 16px var(--accent-cyan-glow);">MINDRUSH</h1>
    </center>
    <!-- TODO: Replace with Firebase sendPasswordResetEmail() -->
    <form id="forgotForm" onsubmit="handleForgotPassword(event)">
        <div class="login-box">
        <h2 class="welcome" id="welcome">Forgot Password</h2>
        <p class="text-login" id="text-login">Enter Your Email to Reset Your Password.</p><br>

        <!-- Status messages will be shown here by JavaScript -->
        <div id="status-message"></div>

        <div class="user-box">
            <input type="email" name="mail" id="email" class="uname" required="">
            <label>Email</label>
        </div>
        <center>
            <button id="set-pass" class="set-pass" type="submit" name="set-pass">
                Send Link
                <span></span>
            </button>
        </center>
        </div>
    </form>
    <script>
        // TODO: Implement Firebase sendPasswordResetEmail
        function handleForgotPassword(event) {
            event.preventDefault();
            var email = document.getElementById('email').value;
            // TODO: Firebase sendPasswordResetEmail(auth, email)
            var statusDiv = document.getElementById('status-message');
            statusDiv.innerHTML = '<span class="msg">Firebase password reset not yet implemented.</span>';
            console.log('Password reset requested for:', email);
        }
    </script>
</body>
</html>
