<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/skyfall-high-resolution-logo-color-on-transparent-background.png">
    <title>MindRush — Contact Us</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('assets/images/CoarseBothInvisiblerail.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
        }

        .contact-container {
            width: 100%;
            max-width: 440px;
            margin: 20px;
            background-color: rgba(10, 10, 20, 0.75);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .logo-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-header img {
            width: 70px;
            height: auto;
        }

        .contact-container h2 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
            color: #fff;
            letter-spacing: 1px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #ccc;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 18px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 6px;
            font-size: 14px;
            background-color: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }

        input:focus,
        textarea:focus {
            border-color: #7b2cbf;
            background-color: rgba(255, 255, 255, 0.12);
        }

        .button {
            width: 100%;
            background: linear-gradient(135deg, #7b2cbf, #9d4edd);
            color: #ffffff;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: transform 0.15s ease, opacity 0.2s;
        }

        .button:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: #aaa;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #fff;
        }

        .msg {
            color: #4ade80;
            font-size: 15px;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="contact-container">
    <div class="logo-header">
        <img src="assets/images/skyfall-high-resolution-logo-color-on-transparent-background.png" alt="Skyfall Logo">
    </div>
    <h2>Contact Support</h2>

    <!-- TODO: Connect to client-side email service (EmailJS / Formspree / Firebase Function) during migration phase -->
    <form id="contactForm" onsubmit="event.preventDefault(); document.getElementById('msg').style.display='block'; document.getElementById('contactForm').reset();">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="your.email@example.com" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" placeholder="How can we help you?" required></textarea>

        <button class="button" type="submit">Send Message</button>
    </form>

    <div class="msg" id="msg">Thank you! Your message has been received. We will get back to you soon.</div>

    <a href="dashboard.html" class="back-link">&larr; Return to Dashboard</a>
</div>

</body>
</html>
