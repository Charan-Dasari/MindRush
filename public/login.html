<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindRush — Cadet Login</title>
  <link rel="icon" type="image/png" href="assets/images/skyfall-high-resolution-logo-color-on-transparent-background.png">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Space Grotesk"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
            arcade: ['"Press Start 2P"', 'monospace', 'cursive'],
          },
          colors: {
            void: '#07090e',
            surface: '#11131d',
            card: '#161926',
            popup: '#141828',
            borderDim: '#2d334a',
            borderMid: '#4b5578',
            textMain: '#F5F8FF',
            textMuted: '#9aa5c4',
            gold: '#FACC15',
            goldMuted: '#ca9e16',
            cyan: '#38BDF8',
            cyanNeon: '#00F2FE',
            pinkNeon: '#F472B6',
            success: '#34D399',
            danger: '#F87171'
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #07090e;
      color: #F5F8FF;
      font-family: 'Space Grotesk', sans-serif;
      overflow-x: hidden;
      user-select: none;
    }

    /* Starfield particle base styling */
    .star {
      position: absolute;
      background-color: #ffffff;
      border-radius: 50%;
      pointer-events: none;
    }
    .star.tiny { width: 1.5px; height: 1.5px; opacity: 0.4; }
    .star.med { width: 3px; height: 3px; opacity: 0.7; }
    .star.twinkle {
      animation: twinkle 3.5s ease-in-out infinite alternate;
    }
    .star.four-point {
      width: 6px;
      height: 6px;
      background: #FACC15;
      clip-path: polygon(50% 0%, 65% 35%, 100% 50%, 65% 65%, 50% 100%, 35% 65%, 0% 50%, 35% 35%);
      opacity: 0.85;
      filter: drop-shadow(0 0 6px rgba(250, 204, 21, 0.6));
    }
    @keyframes twinkle {
      0% { opacity: 0.25; transform: scale(0.85); }
      50% { opacity: 0.9; transform: scale(1.2); }
      100% { opacity: 0.35; transform: scale(0.9); }
    }

    /* Primary glowing Play button matching Screen 12 */
    .arcade-btn-primary {
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      border: 1.5px solid #38BDF8;
      box-shadow: 0 6px 0 #0284c7, 0 0 25px rgba(56, 189, 248, 0.25);
    }
    .arcade-btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, rgba(25, 29, 46, 0.98), rgba(35, 41, 65, 0.98));
      border-color: #FACC15;
      transform: translateY(-3px);
      box-shadow: 0 9px 0 #0284c7, 0 0 32px rgba(250, 204, 21, 0.35);
    }
    .arcade-btn-primary:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 3px 0 #0284c7;
      border-color: #FACC15;
    }
    .arcade-btn-primary:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    /* Concentric Cosmic Radar Rings */
    @keyframes cosmicRadar {
      0% { transform: translate(-50%, -50%) scale(0.7); opacity: 0.35; }
      50% { opacity: 0.55; }
      100% { transform: translate(-50%, -50%) scale(1.35); opacity: 0; }
    }
    .kinetic-wave {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      border: 1.5px dashed rgba(56, 189, 248, 0.2);
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: cosmicRadar 12s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }
    .kinetic-wave.delay-1 {
      animation-delay: 4s;
      border-style: dotted;
      border-color: rgba(250, 204, 21, 0.22);
    }

    /* Floating Math Constellations */
    .constellation-glyph {
      position: absolute;
      pointer-events: none;
      animation: glyphFloat 9s ease-in-out infinite alternate;
      z-index: 1;
    }
    @keyframes glyphFloat {
      0% { transform: translateY(0px) rotate(0deg); opacity: 0.4; }
      50% { transform: translateY(-10px) rotate(1.5deg); opacity: 0.7; }
      100% { transform: translateY(6px) rotate(-1.5deg); opacity: 0.5; }
    }

    /* Custom subtle scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #07090e; }
    ::-webkit-scrollbar-thumb { background: #2d334a; border-radius: 4px; }
  </style>
</head>

<body class="min-h-screen relative flex flex-col justify-between selection:bg-cyan/30 selection:text-cyan bg-void text-textMain">

  <!-- ============================================================ -->
  <!-- BACKGROUND TELEMETRY LAYER                                  -->
  <!-- ============================================================ -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden" id="cosmic-bg">
    <div class="absolute inset-0 bg-[#07090e] bg-[radial-gradient(ellipse_80%_80%_at_50%_-15%,rgba(56,189,248,0.12),rgba(0,0,0,0))]"></div>
    <div class="kinetic-wave"></div>
    <div class="kinetic-wave delay-1"></div>

    <!-- Synapse Glow Line -->
    <svg class="absolute inset-x-0 top-1/2 -translate-y-1/2 w-full h-[320px] pointer-events-none opacity-20" preserveAspectRatio="none" viewBox="0 0 1440 320" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="synapseGlow" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"></stop>
          <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.6"></stop>
          <stop offset="50%" stop-color="#FACC15" stop-opacity="0.9"></stop>
          <stop offset="75%" stop-color="#F472B6" stop-opacity="0.6"></stop>
          <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"></stop>
        </linearGradient>
      </defs>
      <path d="M0,160 Q180,158 280,160 T420,160 L450,130 L470,200 L490,105 L515,215 L535,160 L620,160 Q720,160 840,160 L870,135 L885,190 L900,115 L920,205 L935,160 Q1050,160 1440,160" fill="none" stroke="url(#synapseGlow)" stroke-dasharray="8 6" stroke-width="1.6"></path>
    </svg>

    <!-- Floating Math Challenge Badges -->
    <div class="constellation-glyph pointer-events-none select-none hidden md:block" style="top: 18%; right: 12%; opacity: 0.3;">
      <div class="flex items-center gap-2 px-2.5 py-1 rounded-full border border-borderDim/40 bg-surface/40 backdrop-blur-sm text-[11px] font-mono text-textMuted/70">
        <span>15 + 27 = 42</span>
      </div>
    </div>
    <div class="constellation-glyph pointer-events-none select-none hidden md:block" style="top: 76%; left: 9%; opacity: 0.3;">
      <div class="flex items-center gap-2 px-2.5 py-1 rounded-full border border-borderDim/40 bg-surface/40 backdrop-blur-sm text-[11px] font-mono text-textMuted/70">
        <span>7 × 7 = 49</span>
      </div>
    </div>

    <!-- Twinkling Star Anchors -->
    <div class="star four-point twinkle" style="top: 13%; left: 10%; animation-delay: 0s;"></div>
    <div class="star four-point twinkle" style="top: 26%; left: 89%; animation-delay: 1.5s;"></div>
    <div class="star four-point twinkle" style="top: 69%; left: 7%; animation-delay: 2.2s;"></div>
    <div class="star four-point twinkle" style="top: 82%; left: 85%; animation-delay: 0.8s;"></div>
    <div class="star med twinkle" style="top: 11%; left: 76%; animation-delay: 1s;"></div>
    <div class="star tiny twinkle" style="top: 58%; left: 74%; animation-delay: 2.5s;"></div>
  </div>

  <!-- ============================================================ -->
  <!-- TOP HEADER HUD                                              -->
  <!-- ============================================================ -->
  <header class="relative z-30 w-full px-5 sm:px-8 py-5 flex items-center justify-between">
    <!-- Main Menu Return Button -->
    <a href="dashboard.html" class="group flex items-center gap-2.5 px-3.5 py-2 rounded-xl border border-borderDim bg-surface/80 hover:border-gold hover:bg-card transition-all text-textMain shadow-md backdrop-blur-sm" title="Return to Dashboard">
      <span class="text-gold font-bold text-base mr-1 flex items-center justify-center font-mono leading-none select-none">&lt;</span>
      <div class="flex flex-col text-left">
        <span class="text-[10px] font-mono tracking-widest text-gold font-bold uppercase">MAIN MENU</span>
        <span class="text-xs font-mono font-semibold tracking-wide text-textMain group-hover:text-cyan transition-colors">Homepage</span>
      </div>
    </a>

    <!-- Center HUD Status Pill -->
    <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-card/80 border border-borderDim text-xs font-mono text-textMuted">
      <span class="w-2 h-2 rounded-full bg-cyan inline-block animate-pulse"></span>
      <span class="text-[11px] uppercase tracking-wider text-textMain">LOGIN PORTAL</span>
    </div>

    <!-- Right Action: Sign Up -->
    <div class="flex items-center gap-3">
      <a href="register.html" class="px-3.5 py-2 rounded-xl border border-borderDim bg-surface/80 hover:bg-card hover:border-gold text-xs font-mono font-semibold text-textMain hover:text-gold transition-all shadow-md">
        SIGN UP &rarr;
      </a>
    </div>
  </header>

  <!-- ============================================================ -->
  <!-- CENTER PANEL: Cosmic Glassmorphic Login Modal                -->
  <!-- ============================================================ -->
  <main class="relative z-20 flex-1 flex flex-col items-center justify-center px-4 sm:px-6 py-6">
    <div class="w-full max-w-[500px] relative">
      <!-- Ambient Glow Behind Modal -->
      <div class="absolute -inset-4 bg-void/80 backdrop-blur-xl rounded-3xl pointer-events-none z-0 border border-borderDim/30"></div>
      <div class="absolute -inset-2 bg-gradient-to-r from-cyan/20 via-gold/10 to-pinkNeon/15 rounded-3xl blur-2xl pointer-events-none opacity-70"></div>

      <!-- Main HUD Glass Container -->
      <div class="relative w-full bg-void/90 border border-borderDim/80 rounded-2xl shadow-[0_24px_56px_-12px_rgba(0,0,0,0.9)] backdrop-blur-xl p-6 sm:p-8 z-10">
        
        <!-- Header Arcade Branding -->
        <div class="text-center mb-6 select-none">
          <h1 class="text-2xl sm:text-3xl font-bold tracking-wider text-textMain leading-none uppercase drop-shadow-[0_4px_12px_rgba(0,0,0,0.8)]" style="font-family: 'Press Start 2P', monospace, cursive; letter-spacing: 0.05em; text-shadow: 0 0 16px rgba(56, 189, 248, 0.45), 0 3px 0 #0f172a;">
            MINDRUSH
          </h1>
          <p class="text-xs sm:text-sm text-gold font-bold tracking-widest uppercase font-sans mt-3">
            THINK FAST. WAVE YOUR HANDS. RESUME MISSION!
          </p>
        </div>

        <!-- Inline Server Alert / Notification Box -->
        <div id="general-alert" class="hidden mb-4 p-3 bg-danger/15 border border-danger/40 rounded-xl flex items-center gap-2.5" role="alert">
          <span class="material-symbols-outlined text-danger text-[20px] shrink-0">error</span>
          <span id="general-alert-text" class="text-xs font-mono text-danger font-medium"></span>
        </div>

        <!-- Success Toast Container -->
        <div id="success-alert" class="hidden mb-4 p-3 bg-success/15 border border-success/40 rounded-xl flex items-center gap-2.5" role="alert">
          <span class="material-symbols-outlined text-success text-[20px] shrink-0">check_circle</span>
          <span id="success-alert-text" class="text-xs font-mono text-success font-medium"></span>
        </div>

        <!-- Cadet Login Form -->
        <form id="login-form" class="flex flex-col gap-4" novalidate>
          
          <!-- Cadet Username -->
          <div class="flex flex-col gap-1.5">
            <div class="flex items-center justify-between">
              <label for="username-field" class="text-xs font-mono font-semibold tracking-wide text-textMuted uppercase flex items-center gap-1.5">
                <span class="material-symbols-outlined text-[16px] text-textMuted">badge</span>
                CADET USERNAME
              </label>
              <span id="username-error" class="hidden text-xs font-mono text-danger flex items-center gap-1">
                <span class="material-symbols-outlined text-[14px]">warning</span> Required
              </span>
            </div>
            <div class="relative rounded-xl bg-surface/50 border border-borderDim/70 backdrop-blur-md focus-within:border-cyan focus-within:ring-1 focus-within:ring-cyan transition-all" id="user-wrapper">
              <input
                type="text"
                id="username-field"
                name="username"
                autocomplete="username"
                placeholder="e.g. Cadet_Alex or StarVoyager_09"
                required
                class="w-full h-11 px-3.5 bg-transparent text-textMain text-sm font-sans placeholder:text-textMuted/40 focus:outline-none rounded-xl"
              >
            </div>
          </div>

          <!-- Security Passcode -->
          <div class="flex flex-col gap-1.5">
            <div class="flex items-center justify-between">
              <label for="password-field" class="text-xs font-mono font-semibold tracking-wide text-textMuted uppercase flex items-center gap-1.5">
                <span class="material-symbols-outlined text-[16px] text-textMuted">key</span>
                SECURITY PASSCODE
              </label>
              <span id="password-error" class="hidden text-xs font-mono text-danger flex items-center gap-1">
                <span class="material-symbols-outlined text-[14px]">warning</span> Required
              </span>
            </div>
            <div class="relative rounded-xl bg-surface/50 border border-borderDim/70 backdrop-blur-md focus-within:border-cyan focus-within:ring-1 focus-within:ring-cyan transition-all" id="pass-wrapper">
              <input
                type="password"
                id="password-field"
                name="password"
                autocomplete="current-password"
                placeholder="Enter your secret passcode"
                required
                class="w-full h-11 pl-3.5 pr-11 bg-transparent text-textMain text-sm font-sans placeholder:text-textMuted/40 focus:outline-none rounded-xl"
              >
              <button
                type="button"
                id="toggle-password"
                aria-label="Toggle password visibility"
                class="absolute right-0 top-0 bottom-0 px-3 flex items-center justify-center text-textMuted hover:text-textMain transition-colors"
              >
                <span class="material-symbols-outlined text-[20px]" id="toggle-password-icon">visibility</span>
              </button>
            </div>
          </div>

          <!-- Remember Station Checkbox -->
          <div class="flex items-center justify-between pt-0.5">
            <label class="flex items-center gap-2 cursor-pointer select-none group">
              <input
                type="checkbox"
                id="remember-me"
                name="remember"
                checked
                class="w-4 h-4 rounded border-borderMid bg-card text-cyan focus:ring-cyan focus:ring-offset-void cursor-pointer accent-cyan"
              >
              <span class="text-xs font-sans text-textMuted group-hover:text-textMain transition-colors">Remember this station</span>
            </label>
            <a href="forgot-password.html" class="text-xs font-sans text-cyan hover:text-cyanNeon transition-colors font-medium hover:underline underline-offset-4">
              Forgot Passcode?
            </a>
          </div>

          <!-- Primary CTA Button matching PLAY NOW from Screen 12 -->
          <div class="mt-2">
            <button
              type="submit"
              id="login-btn"
              class="arcade-btn-primary w-full h-[68px] sm:h-[74px] rounded-2xl flex items-center justify-between px-5 bg-gradient-to-r from-card to-surface text-textMain font-bold tracking-wide focus:outline-none group backdrop-blur-md relative overflow-hidden"
            >
              <div class="flex items-center gap-3.5 text-left">
                <!-- Left Play Icon Badge identical to Screen 12 -->
                <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl bg-cyan/15 border border-cyan/50 flex items-center justify-center text-cyan group-hover:bg-cyan group-hover:text-void transition-colors shadow-md flex-shrink-0">
                  <svg class="w-5 h-5 ml-0.5 fill-current" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
                </div>
                <div>
                  <div class="text-base sm:text-lg font-sans font-bold tracking-tight text-textMain group-hover:text-cyan transition-colors flex items-center gap-2">
                    <span id="btn-text">CADET SIGN IN</span>
                  </div>
                  <div class="text-[11px] sm:text-xs font-sans text-gold font-medium mt-0.5 flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                    <span>ACCESS SAVED XP & MISSIONS</span>
                  </div>
                </div>
              </div>

              <!-- Right Arrow Indicator -->
              <svg class="w-5 h-5 text-cyan group-hover:translate-x-1.5 transition-transform flex-shrink-0" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24">
                <line x1="5" x2="19" y1="12" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>

              <!-- Loading State Spinner -->
              <div id="btn-spinner" class="hidden absolute inset-0 bg-card/95 backdrop-blur-sm flex items-center justify-center gap-2 text-cyan font-mono text-xs font-bold">
                <svg class="animate-spin h-5 w-5 text-cyan" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" d="M4 12a8 8 0 018-8v8H4z" fill="currentColor"></path>
                </svg>
                <span>CONNECTING FLIGHT DECK...</span>
              </div>
            </button>
          </div>
        </form>

        <!-- Switch Screen Link: Sign Up -->
        <div class="mt-6 pt-4 border-t border-borderDim/70 text-center">
          <p class="text-xs sm:text-sm text-textMuted font-sans">
            New to flight deck?
            <a href="register.html" class="font-bold text-gold hover:text-goldMuted transition-colors ml-1 inline-flex items-center gap-1 hover:underline underline-offset-4">
              Create New Account <span class="material-symbols-outlined text-[15px]">arrow_forward</span>
            </a>
          </p>
        </div>

      </div>
    </div>
  </main>

  <!-- ============================================================ -->
  <!-- JAVASCRIPT: Client Auth & Session Integration               -->
  <!-- ============================================================ -->
  <script>
    // Check if already authenticated; if so, redirect immediately to dashboard
    (async function checkExistingSession() {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'include' });
        if (res.ok) {
          const data = await res.json();
          if (data && data.authenticated) {
            window.location.replace('dashboard.html');
          }
        }
      } catch (e) {
        // Offline or server booting
      }
    })();

    // Password visibility toggle
    const togglePassBtn = document.getElementById('toggle-password');
    const passField = document.getElementById('password-field');
    const passIcon = document.getElementById('toggle-password-icon');

    if (togglePassBtn && passField && passIcon) {
      togglePassBtn.addEventListener('click', () => {
        const isPassword = passField.type === 'password';
        passField.type = isPassword ? 'text' : 'password';
        passIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    // Real Login Form Submission
    const loginForm = document.getElementById('login-form');
    const userInput = document.getElementById('username-field');
    const passInput = document.getElementById('password-field');
    const userError = document.getElementById('username-error');
    const passError = document.getElementById('password-error');
    const loginBtn = document.getElementById('login-btn');
    const btnSpinner = document.getElementById('btn-spinner');
    const generalAlert = document.getElementById('general-alert');
    const generalAlertText = document.getElementById('general-alert-text');
    const successAlert = document.getElementById('success-alert');
    const successAlertText = document.getElementById('success-alert-text');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      let hasError = false;

      generalAlert.classList.add('hidden');
      successAlert.classList.add('hidden');

      const usernameVal = userInput.value.trim();
      const passwordVal = passInput.value;

      if (!usernameVal) {
        userError.classList.remove('hidden');
        hasError = true;
      } else {
        userError.classList.add('hidden');
      }

      if (!passwordVal) {
        passError.classList.remove('hidden');
        hasError = true;
      } else {
        passError.classList.add('hidden');
      }

      if (hasError) return;

      // Disable button and show spinner
      loginBtn.disabled = true;
      btnSpinner.classList.remove('hidden');

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          credentials: 'include',
          body: JSON.stringify({
            username: usernameVal,
            password: passwordVal
          })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          if (data.user) {
            try {
              sessionStorage.setItem('mindrush_active_user', JSON.stringify(data.user));
            } catch (e) {}
          }
          successAlertText.textContent = data.message || `Welcome back, Cadet! Telemetry synced.`;
          successAlert.classList.remove('hidden');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 600);
        } else {
          loginBtn.disabled = false;
          btnSpinner.classList.add('hidden');
          generalAlertText.textContent = data.error || 'Authentication key invalid. Please verify station ID.';
          generalAlert.classList.remove('hidden');
        }
      } catch (err) {
        loginBtn.disabled = false;
        btnSpinner.classList.add('hidden');
        generalAlertText.textContent = 'Mission Control connection failed. Please ensure the server is online and retry.';
        generalAlert.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
