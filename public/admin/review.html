<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindRush Admin — Question Review Queue</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@400;600;700&display=swap">
  <style>
    body {
      background: #0b0f19;
      color: #e2e8f0;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
    }
    .admin-container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 24px;
      background: #111827;
      border-radius: 12px;
      border: 1px solid #1f2937;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #374151;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      color: #38bdf8;
      font-size: 24px;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="admin-header">
      <div>
        <h1>Human Review Queue</h1>
        <p style="margin: 40px 0 0 0; color: #94a3b8; font-size: 14px;">Questions Awaiting Review: <span id="pending-count" style="color: #38bdf8; font-weight:700;">0</span></p>
      </div>
      <a href="index.html" style="color: #38bdf8; text-decoration: none;">&larr; Admin Dashboard</a>
    </div>

    <div id="review-cards-container">
      <div style="padding: 24px; text-align: center; color: #94a3b8;">Loading questions...</div>
    </div>
  </div>

  <script src="js/review.js"></script>
</body>
</html>
