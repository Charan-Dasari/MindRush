<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindRush Admin — AI Question Generation</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@400;600;700&display=swap">
  <style>
    body {
      background: #0b0f19;
      color: #e2e8f0;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
    }
    .admin-container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 24px;
      background: #111827;
      border-radius: 12px;
      border: 1px solid #1f2937;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #374151;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      color: #38bdf8;
      font-size: 24px;
      margin: 0;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #94a3b8;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #374151;
      background: #1e293b;
      color: #f8fafc;
      font-size: 14px;
      box-sizing: border-box;
    }
    .btn-primary {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      transition: background 0.2s;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .btn-primary:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    .batch-status-card {
      margin-top: 24px;
      padding: 16px;
      border-radius: 8px;
      background: #1e293b;
      border: 1px solid #334155;
      display: none;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-pending { background: #ca8a04; color: white; }
    .badge-generating { background: #0284c7; color: white; }
    .badge-completed { background: #16a34a; color: white; }
    .badge-failed { background: #dc2626; color: white; }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="admin-header">
      <h1>Question Generation Console</h1>
      <a href="index.html" style="color: #38bdf8; text-decoration: none;">&larr; Admin Dashboard</a>
    </div>

    <form id="generation-form">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div class="form-group">
          <label for="curriculum">Curriculum</label>
          <select id="curriculum" required>
            <option value="cmo_std_1_math">CMO (Crest Mathematics Olympiad)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="standard">Standard / Grade</label>
          <select id="standard" required>
            <option value="1">Standard 1</option>
          </select>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" value="Mathematics" readonly>
        </div>
        <div class="form-group">
          <label for="topic">Topic</label>
          <select id="topic" required>
            <option value="Addition">Addition</option>
            <option value="Subtraction">Subtraction</option>
            <option value="Numerals">Numerals</option>
            <option value="Number Sense">Number Sense</option>
            <option value="Money">Money</option>
            <option value="Time">Time</option>
            <option value="Geometrical Shapes">Geometrical Shapes</option>
          </select>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div class="form-group">
          <label for="difficulty">Difficulty</label>
          <select id="difficulty" required>
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>
        <div class="form-group">
          <label for="count">Question Count (1 - 50)</label>
          <input type="number" id="count" value="5" min="1" max="50" required>
        </div>
      </div>

      <div style="margin-top: 16px;">
        <button type="submit" id="generate-btn" class="btn-primary">Initiate Local LLM Generation</button>
      </div>
    </form>

    <div id="batch-monitor" class="batch-status-card">
      <h3 style="margin-top:0; color:#38bdf8;">Generation Batch Progress</h3>
      <p><strong>Batch ID:</strong> <span id="batch-id-disp">-</span></p>
      <p><strong>Status:</strong> <span id="batch-status-badge" class="badge">PENDING</span></p>
      <p><strong>Generated Count:</strong> <span id="batch-count-disp">0</span></p>
      <div id="batch-msg" style="color: #94a3b8; font-size: 13px;"></div>
    </div>
  </div>

  <script src="js/generate.js"></script>
</body>
</html>
